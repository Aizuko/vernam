[package]
name = "signal-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Signal's avatar colors hash the account id.
sha2 = "0.11"
sqlx.workspace = true
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Poll limits count characters as Desktop does: graphemes.
unicode-segmentation = "1"

# Elsewhere than macOS (where SQLCipher uses CommonCrypto), SQLCipher's
# crypto in Rust rather than OpenSSL: libsignal links BoringSSL, whose
# libcrypto the linker finds first and which lacks OpenSSL 3's EVP_CIPHER_get_*
# that SQLCipher calls. The database format is the same either way.
[target.'cfg(not(target_os = "macos"))'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled-sqlcipher-custom-crypto"] }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
